<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Based on Creativity</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #1a1f4b; color: #faf3e0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 20%, rgba(255, 200, 87, .12), transparent 48%), #1a1f4b; }
      main { max-width: 560px; text-align: center; }
      .code { margin: 0 0 8px; color: #ffc857; font-size: clamp(5rem, 20vw, 9rem); font-weight: 700; line-height: 1; }
      h1 { margin: 16px 0; font-size: clamp(1.4rem, 5vw, 2rem); }
      p { color: rgba(250, 243, 224, .72); line-height: 1.65; }
      a { display: inline-block; margin-top: 20px; padding: 13px 22px; border-radius: 999px; background: #ffc857; color: #1a1f4b; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist or may have moved.</p>
      <a href="/">Return to the homepage</a>
    </main>
  </body>
</html>
